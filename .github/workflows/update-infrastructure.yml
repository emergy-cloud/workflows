# emergy.cloud workflow contract: astro v9 (shared logic)
# -----------------------------------------------------------------------------
# STUB — the pipeline logic lives in the shared, versioned workflow
#   emergy-cloud/workflows/.github/workflows/update-infrastructure.yml@v9        (github.com/emergy-cloud/workflows)
# This file keeps only what has to sit in the repository: the triggers,
# permissions, concurrency, the inputs and the ENVS fallback. A logic fix
# reaches every repository by moving the v9 tag; a contract change (inputs,
# triggers, file names) ships as a new stub + a new tag.
# CONTRACT - do not rename this file, the run-name, the job id or the inputs:
# the emergy platform dispatches and parses them.
# -----------------------------------------------------------------------------
# REUSABLE: every repository calls this file through a thin stub —
#   uses: emergy-cloud/workflows/.github/workflows/update-infrastructure.yml@v9
#   secrets: inherit
# Triggers, permissions and concurrency live in the calling stub; vars.* and
# secrets.* resolve in the CALLING repository, and the OIDC token keeps the
# caller's identity, so the AWS trust policies do not change.
# -----------------------------------------------------------------------------
name: Update Infrastructure

on:
  workflow_call:
    inputs:
      envs:
        description: "Comma-separated enabled environments — the stub passes its ENVS fallback so a repository without the variable still behaves like its copy"
        required: false
        type: string
        default: ""

jobs:
  update:
    uses: emergy-cloud/workflows/.github/workflows/update-infrastructure.yml@v9
    with:
      envs: ${{ inputs.envs || vars.ENVS || 'dev,staging,prod' }}
    secrets: inherit
