# emergy.cloud workflow contract: astro v9 (shared logic)
# -----------------------------------------------------------------------------
# emergy.cloud CI/CD reference - Update Infrastructure (Astro)
#
# Applies the repository's terraform (infrastructure/) against the project's
# AWS account: website buckets, CloudFront distributions, and - for SSR
# templates - the Lambda that serves rendered pages. Runs on pushes to main
# that touch infrastructure/, or manually. The same file works for every
# Astro template - SSR build steps are detected at runtime, and a repo can
# declare extra terraform-packaged artifacts via an optional
# website/package.json "prepare:infra" script (run before apply when present).
#
# Repository variables maintained by the emergy platform:
#   PROJECT_ID, AWS_REGION, AWS_ACCOUNT_ID, AWS_INFRA_ROLE_TO_ASSUME,
#   TF_BACKEND_BUCKET, TF_STATE_KEY_PREFIX, ENVS,
#   HOSTNAME_<ENV>, AWS_WEBSITE_ACM_ARN_<ENV>,
#   AWS_WEBSITE_ACM_NAME_<ENV> (environment custom-domain configuration)
# Optional overrides you may set yourself:
#   NODE_VERSION (default 24), TF_VERSION, INFRA_DIR
#
# GitHub Deployments: one deployment per enabled environment (ENVS) is
# created, marked in progress, then resolved to success/failure with the
# environment URL read from the terraform output named <environment>_cdn_url.
# The emergy platform reads these deployments to surface environment URLs.
#
# CONTRACT - do not rename this file
# (.github/workflows/update-infrastructure.yml); the emergy platform matches
# infrastructure runs by that path.
# -----------------------------------------------------------------------------
# REUSABLE: every repository calls this file through a thin stub —
#   uses: emergy-cloud/workflows/.github/workflows/update-infrastructure.yml@v9
#   secrets: inherit
# Triggers, permissions and concurrency live in the calling stub; vars.* and
# secrets.* resolve in the CALLING repository, and the OIDC token keeps the
# caller's identity, so the AWS trust policies do not change.
# -----------------------------------------------------------------------------
name: Update Infrastructure

on:
  workflow_call:
    inputs:
      envs:
        description: "Comma-separated enabled environments — the stub passes its ENVS fallback so a repository without the variable still behaves like its copy"
        required: false
        type: string
        default: ""

jobs:
  update:
    # Skip the very first push (the commit that creates the repo from the
    # template) - the AWS account is not provisioned yet at that point.
    if: ${{ !(github.event_name == 'push' && github.run_number == 1) }}

    runs-on: ubuntu-latest

    env:
      INFRA_DIR: ${{ vars.INFRA_DIR || 'infrastructure' }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      TF_VERSION: ${{ vars.TF_VERSION || '1.15.8' }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
      TF_STATE_KEY_PREFIX: ${{ vars.TF_STATE_KEY_PREFIX || 'default-project' }}
      ROLE_TO_ASSUME: ${{ vars.AWS_INFRA_ROLE_TO_ASSUME }}
      NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}

      # Enabled environments - maintained by the platform
      ENVS: ${{ inputs.envs || vars.ENVS || 'dev,staging,prod' }}

      # Pass-thru TF vars the terraform root uses
      TF_VAR_aws_account_number: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_project_id: ${{ vars.PROJECT_ID }}
      TF_VAR_base_domain: ${{ vars.AWS_WEBSITE_ACM_NAME }}
      TF_VAR_aws_website_acm_arn: ${{ vars.AWS_WEBSITE_ACM_ARN }}
      TF_VAR_base_domain_dev: ${{ vars.AWS_WEBSITE_ACM_NAME_DEV }}
      TF_VAR_base_domain_staging: ${{ vars.AWS_WEBSITE_ACM_NAME_STAGING }}
      TF_VAR_base_domain_prod: ${{ vars.AWS_WEBSITE_ACM_NAME_PROD }}
      TF_VAR_aws_website_acm_arn_dev: ${{ vars.AWS_WEBSITE_ACM_ARN_DEV }}
      TF_VAR_aws_website_acm_arn_staging: ${{ vars.AWS_WEBSITE_ACM_ARN_STAGING }}
      TF_VAR_aws_website_acm_arn_prod: ${{ vars.AWS_WEBSITE_ACM_ARN_PROD }}
      TF_VAR_envs: ${{ inputs.envs || vars.ENVS || 'dev,staging,prod' }}
      # Linked hostname per environment - CloudFront only serves a custom
      # domain on an environment the platform actually linked one to
      TF_VAR_hostname_dev: ${{ vars.HOSTNAME_DEV }}
      TF_VAR_hostname_staging: ${{ vars.HOSTNAME_STAGING }}
      TF_VAR_hostname_prod: ${{ vars.HOSTNAME_PROD }}

    permissions:
      id-token: write
      contents: read
      deployments: write

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.INFRA_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # AWS answers every refused OIDC assume with the same opaque string,
      # whatever the cause - wrong role, missing provider, unmatched trust. The
      # token is the only thing that can say which, so print its claims (never
      # the token) when the assume fails. Compare `sub` against the deploy
      # role's trust condition; they must match exactly.
      - name: Explain OIDC failure
        if: failure() && steps.aws_credentials.conclusion == 'failure'
        working-directory: .
        run: |
          echo "::error::${ROLE_TO_ASSUME} did not trust this workflow's OIDC token"
          T=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2 | tr '_-' '/+')
          # A JWT payload is unpadded base64url - base64 needs the "=" back,
          # or it decodes the claims and still exits "base64: invalid input".
          case $(( ${#P} % 4 )) in 2) P="$P==" ;; 3) P="$P=" ;; esac
          printf '%s' "$P" | base64 -d | jq '{sub,aud,repository}'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # SSR templates (a "prepare:aws" script in website/package.json) need a
      # server bundle and a Lambda layer for terraform to package; a
      # "prepare:infra" script builds extra artifacts terraform packages
      # (e.g. a worker Lambda bundle), whatever the template shape.
      - name: Detect project shape
        id: shape
        working-directory: .
        run: |
          set -euo pipefail
          PM=npm; LOCKFILE=package-lock.json
          if [ -f website/pnpm-lock.yaml ]; then PM=pnpm; LOCKFILE=pnpm-lock.yaml; fi
          # setup-node's cache resolves cache-dependency-path against the
          # checkout; a repo without a committed lockfile would fail the whole
          # job there ("Some specified paths were not resolved"), so run
          # uncached instead and surface the real problem.
          CACHE="$PM"
          if [ ! -f "website/${LOCKFILE}" ]; then
            CACHE=''
            echo "::warning::website/${LOCKFILE} is not committed - dependency caching disabled; commit the lockfile to fix this"
          fi
          SSR=false
          if jq -e '.scripts["prepare:aws"]' website/package.json >/dev/null 2>&1; then SSR=true; fi
          INFRA_PREPARE=false
          if jq -e '.scripts["prepare:infra"]' website/package.json >/dev/null 2>&1; then INFRA_PREPARE=true; fi
          # pnpm/action-setup reads the pnpm version from the "packageManager"
          # field; repos without the field get an explicit fallback instead of
          # a "No pnpm version is specified" failure.
          PNPM_VERSION=''
          if [ "$PM" = pnpm ] && ! jq -e '.packageManager? | strings | startswith("pnpm@")' website/package.json >/dev/null 2>&1; then
            PNPM_VERSION=10
            echo "No pnpm \"packageManager\" entry in package.json - defaulting to pnpm ${PNPM_VERSION}"
          fi
          echo "Detected: pm=$PM ssr=$SSR infra_prepare=$INFRA_PREPARE"
          { echo "pm=$PM"; echo "lockfile=$LOCKFILE"; echo "cache=$CACHE"; echo "ssr=$SSR"; echo "infra_prepare=$INFRA_PREPARE"; echo "pnpm_version=$PNPM_VERSION"; } >> "$GITHUB_OUTPUT"

      # pnpm version comes from the "packageManager" field in the website's
      # package.json - package_json_file matters: the action defaults to the
      # repo-root package.json, which does not exist here. The shape step
      # supplies a fallback version when the field is absent (an empty version
      # input means "read packageManager").
      - name: Setup pnpm
        if: (steps.shape.outputs.ssr == 'true' || steps.shape.outputs.infra_prepare == 'true') && steps.shape.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.shape.outputs.pnpm_version }}
          package_json_file: website/package.json

      - name: Setup Node
        if: steps.shape.outputs.ssr == 'true' || steps.shape.outputs.infra_prepare == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.shape.outputs.cache }}
          cache-dependency-path: website/${{ steps.shape.outputs.lockfile }}

      # State locking is S3-native (a .tflock object next to the state);
      # the DynamoDB lock table is deprecated in Terraform and unused here.
      - name: Terraform Init (S3 backend with S3-native locking)
        run: |
          set -euo pipefail
          rm -rf .terraform
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY_PREFIX}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: Build Lambda layer (SSR runtime dependencies)
        if: steps.shape.outputs.ssr == 'true'
        run: |
          set -euo pipefail
          cd lambda_layer/nodejs
          npm init -y
          npm install @aws-sdk/client-lambda @aws-sdk/client-s3 axios fs lodash node-gzip

          cd ..
          zip -r lambda_layer_website_ssr.zip nodejs

      - name: Build server artifacts
        if: steps.shape.outputs.ssr == 'true' || steps.shape.outputs.infra_prepare == 'true'
        working-directory: website
        run: |
          set -euo pipefail
          if [ "${{ steps.shape.outputs.pm }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
          if [ "${{ steps.shape.outputs.ssr }}" = "true" ]; then
            "${{ steps.shape.outputs.pm }}" run build
            "${{ steps.shape.outputs.pm }}" run prepare:aws
          fi
          if [ "${{ steps.shape.outputs.infra_prepare }}" = "true" ]; then
            "${{ steps.shape.outputs.pm }}" run prepare:infra
          fi

      # One GitHub Deployment per enabled environment, all marked in progress
      # while terraform runs. The id map travels to the status steps below.
      - name: Create GitHub Deployments (in progress)
        id: deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS='{}'
          IFS=',' read -ra ENV_LIST <<< "${ENVS}"
          for E in "${ENV_LIST[@]}"; do
            body=$(jq -n --arg ref "${{ github.sha }}" --arg env "$E" '
              { ref: $ref, auto_merge: false, environment: $env, required_contexts: [] }')
            resp=$(echo "$body" | gh api -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              repos/${{ github.repository }}/deployments --input -)
            ID=$(echo "$resp" | jq -r .id)
            gh api -X POST -H "Accept: application/vnd.github+json" \
              repos/${{ github.repository }}/deployments/$ID/statuses \
              -f state="in_progress" \
              -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            IDS=$(echo "$IDS" | jq -c --arg env "$E" --argjson id "$ID" '. + {($env): $id}')
          done
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      # The terraform root manages every enabled environment in one state -
      # a single apply updates them all.
      - name: Terraform Apply
        run: terraform apply -auto-approve

      # Resolve each deployment with its URL (terraform output
      # <environment>_cdn_url). The emergy platform reads the environment_url.
      - name: Mark Deployments success
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IDS='${{ steps.deployments.outputs.ids }}'
          [ -n "$IDS" ] || IDS='{}'
          IFS=',' read -ra ENV_LIST <<< "${ENVS}"
          for E in "${ENV_LIST[@]}"; do
            ID=$(echo "$IDS" | jq -r --arg env "$E" '.[$env] // empty')
            [ -n "$ID" ] || continue
            URL=$(terraform output -raw "${E}_cdn_url" 2>/dev/null || true)
            args=(-f state="success")
            if [ -n "$URL" ]; then args+=(-f environment_url="$URL"); fi
            args+=(-f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            gh api -X POST -H "Accept: application/vnd.github+json" \
              repos/${{ github.repository }}/deployments/$ID/statuses "${args[@]}"
          done

      - name: Mark Deployments failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Empty when the run failed before the deployments step.
          IDS='${{ steps.deployments.outputs.ids }}'
          [ -n "$IDS" ] || IDS='{}'
          IFS=',' read -ra ENV_LIST <<< "${ENVS}"
          for E in "${ENV_LIST[@]}"; do
            ID=$(echo "$IDS" | jq -r --arg env "$E" '.[$env] // empty')
            [ -n "$ID" ] || continue
            gh api -X POST -H "Accept: application/vnd.github+json" \
              repos/${{ github.repository }}/deployments/$ID/statuses \
              -f state="failure" \
              -f description="Terraform apply failed" \
              -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
