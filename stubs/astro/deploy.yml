# emergy.cloud workflow contract: astro v10
# -----------------------------------------------------------------------------
# STUB: the pipeline logic is the reusable workflow named on the `uses:` line
# of the job below (the shared emergy.cloud workflows at a version tag, or a
# vendored copy next to this file). This file keeps only what has to sit in
# the repository: the triggers, permissions, concurrency, the inputs and the
# ENVS fallback. Generated from the emergy.cloud stub templates; refresh or
# bump it with the tool that wrote it (the installer or the platform's CI/CD
# reference), not by hand.
# CONTRACT - do not rename this file, the run-name, the job id or the inputs:
# the emergy platform dispatches and parses them.
# -----------------------------------------------------------------------------
name: Deploy
run-name: Deploy ${{ inputs.environment }} @ ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to - one of the enabled environments (the ENVS repository variable)
        required: true
        type: string
      sha:
        description: Commit SHA to deploy (artifact key)
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: write   # the approval-gated promotion dispatches Deploy again

# Avoid overlapping deploys to the same environment
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }} from sha ${{ inputs.sha }}
    uses: emergy-cloud/workflows/.github/workflows/deploy.yml@v10
    with:
      envs: ${{ vars.ENVS || 'dev,staging,prod' }}
      environment: ${{ inputs.environment }}
      sha: ${{ inputs.sha }}
    secrets: inherit
